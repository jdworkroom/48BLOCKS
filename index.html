 eachDay((d,a)=>{if(d<r.from||d>r.to)return;for(const x of a){if(!x)continue;const st=(x.p&&stat.get(x.p))||none;st.n++}});
 let total=none.n;for(const v of stat.values())total+=v.n;
 $('prjInfo').textContent=r.label+' · '+total+(total===1?' BLOCK':' BLOCKS');
 const rows=[...list.map(p=>({p,st:stat.get(p.id),color:p.color,name:p.name})),...(none.n?[{p:null,st:none,color:NOPRJ,name:'미분류'}]:[])];
 const chart=$('prjChart');chart.replaceChildren();chart.classList.toggle('empty',!total);
 for(const row of rows){if(!row.st.n)continue;const i=node('i','');i.style.background=row.color;i.style.flexGrow=String(row.st.n);chart.append(i)}
 const ul=$('prjList');ul.replaceChildren();
 for(const row of rows){
  const li=node('li',''),b=node(row.p?'button':'div','');b.className='prjRow';
  if(row.p){b.type='button';b.onclick=()=>openPrjSheet(row.p)}
  const sq=node('i','');sq.className='prjSq';sq.style.background=row.color;
  const nm=node('b',row.name);nm.className='prjName';
  const num=node('span',String(row.st.n));num.className='prjNum';
  const h=node('span',(row.st.n/2)+'H');h.className='prjH';
  b.append(sq,nm,num,h);b.setAttribute('aria-label',row.name+' · '+row.st.n+'블록 · '+(row.st.n/2)+'시간'+(row.p?' · 눌러서 수정':''));
  li.append(b);ul.append(li);
 }
 const li=node('li',''),add=node('button','+ 새 프로젝트');add.type='button';add.className='prjRow prjNew';add.onclick=()=>openPrjSheet(null);li.append(add);ul.append(li);
 if(!list.length){const n=node('li','블록을 등록할 때 프로젝트를 고르면 그 프로젝트 색으로 칠해져요.');n.className='prjNote';ul.append(n)}
}
function shiftPrj(dir){
 if(prjPeriod==='all')return;
 const a=new Date((prjAnchor||day)+'T12:00');
 if(prjPeriod==='week')a.setDate(a.getDate()+dir*7);else a.setMonth(a.getMonth()+dir,1);
 prjAnchor=dateKey(a);renderProjects();
 for(const el of [$('prjChart'),$('prjList')]){el.classList.remove('weekInR','weekInL');void el.offsetWidth;el.classList.add(dir>0?'weekInR':'weekInL')}
}
$('prjHead').onclick=()=>{prjPeriod={week:'month',month:'all',all:'week'}[prjPeriod];renderProjects()};
{let ps=null;const pv=$('projects');
 pv.addEventListener('touchstart',e=>{if(e.touches.length===1)ps={x:e.touches[0].clientX,y:e.touches[0].clientY};else ps=null},{passive:true});
 pv.addEventListener('touchend',e=>{if(!ps)return;const t=e.changedTouches[0],dx=t.clientX-ps.x,dy=t.clientY-ps.y;ps=null;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.4){if(e.cancelable)e.preventDefault();shiftPrj(dx<0?1:-1)}},{passive:false});
 pv.addEventListener('touchcancel',()=>{ps=null});}
window.addEventListener('storage',e=>{
 if(!e.key||!e.key.startsWith(uid+'.')||e.newValue===null||cache.get(e.key)===e.newValue)return;
 cache.set(e.key,e.newValue);applyExternal([e.key]);
});

darkQuery.addEventListener('change',()=>{if(themePref==='system'){applyTheme();render()}});
let compactMode=false,pinch=null;
let relayoutTimer=null;
function settleLabels(grid){
 grid.classList.add('resizing');clearTimeout(relayoutTimer);
 relayoutTimer=setTimeout(()=>{layoutLabels(grid);grid.classList.remove('resizing')},260);
}
function applyCompact(){
 const on=compactMode&&!$('table').hidden;
 document.documentElement.classList.toggle('compact',on);
 const grid=$('grid');
 if(!on){grid.style.removeProperty('--row');grid.style.removeProperty('--label');settleLabels(grid);return}
 window.scrollTo({top:0});
 requestAnimationFrame(()=>{
  const top=grid.getBoundingClientRect().top+window.scrollY,bar=document.querySelector('.bottomBar').offsetHeight;
  const row=Math.max(14,Math.min(40,Math.floor((window.innerHeight-top-bar-10)/24)));
  grid.style.setProperty('--row',row+'px');grid.style.setProperty('--label','12px');
  settleLabels(grid);
 });
}
function setCompact(on){
 if(compactMode===on)return;compactMode=on;applyCompact();
 hidePinchHint();
}
window.addEventListener('resize',()=>{if(compactMode)applyCompact()});
document.addEventListener('touchmove',e=>{if(compactMode&&!$('table').hidden&&!document.querySelector('dialog[open]')&&e.cancelable)e.preventDefault()},{passive:false});
const touchDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
document.addEventListener('touchstart',e=>{
 if(e.touches.length===2&&!$('table').hidden&&!document.querySelector('dialog[open]')){pinch={d:touchDist(e.touches),done:false};resetDrag();dateSwipe=null;clearSlide()}
},{passive:true});
document.addEventListener('touchmove',e=>{
 if(!pinch||pinch.done||e.touches.length!==2)return;
 const r=touchDist(e.touches)/pinch.d;
 if(r<0.8){setCompact(true);pinch.done=true}else if(r>1.25){setCompact(false);pinch.done=true}
},{passive:true});
document.addEventListener('touchend',e=>{if(e.touches.length<2)pinch=null});
document.addEventListener('touchcancel',()=>{pinch=null});
window.addEventListener('wheel',e=>{
 if(!e.ctrlKey||$('table').hidden||document.querySelector('dialog[open]'))return;
 e.preventDefault();if(Math.abs(e.deltaY)<4)return;setCompact(e.deltaY>0);
},{passive:false});

$('pinchHint').onclick=hidePinchHint;

function validDay(key){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(key))return false;
 const d=new Date(key+'T12:00');
 return !Number.isNaN(d.getTime())&&dateKey(d)===key;
}
function backupData(){
 const days={},todos={};
 for(const key of cache.keys()){
  if(key.startsWith(uid+'.todo.')&&validDay(key.slice((uid+'.todo.').length)))todos[key.slice((uid+'.todo.').length)]=JSON.parse(records.getItem(key));
  if(key.startsWith(uid+'.')&&validDay(key.slice(uid.length+1))){
   const dayKey=key.slice(uid.length+1);
   days[dayKey]=read('.'+dayKey);
  }
 }
 return {format:'haru-blocks',version:3,days,todos,projects:projects()};
}
function checkBackup(data){
 const activity=a=>a&&typeof a.name==='string'&&a.name.trim()&&a.name.length<=60&&typeof a.color==='string'&&/^#[0-9a-f]{6}$/i.test(a.color)&&(a.p===undefined||(typeof a.p==='string'&&a.p.length<=64));
 if(data?.format!=='haru-blocks'||![1,2,3].includes(data.version)||!data.days||typeof data.days!=='object'||Array.isArray(data.days)||(data.recent!==undefined&&!Array.isArray(data.recent)))throw Error('48BLOCKS에서 다운로드한 백업 파일을 선택해 주세요.');
 if(data.version>=2&&(!data.todos||typeof data.todos!=='object'||Array.isArray(data.todos)||!Object.entries(data.todos).every(([key,items])=>validDay(key)&&Array.isArray(items)&&items.every(x=>x&&typeof x.id==='string'&&x.id&&typeof x.text==='string'&&x.text.trim()&&x.text.length<=200&&typeof x.done==='boolean'&&(x.p===undefined||(typeof x.p==='string'&&x.p.length<=64))&&(x.color===undefined||(typeof x.color==='string'&&/^#[0-9a-f]{6}$/i.test(x.color)))))))throw Error('할 일 데이터의 형식이 올바르지 않아요.');
 if(data.version===3&&(!Array.isArray(data.projects)||!data.projects.every(p=>p&&typeof p.id==='string'&&p.id&&p.id.length<=64&&typeof p.name==='string'&&p.name.trim()&&p.name.length<=40&&typeof p.color==='string'&&/^#[0-9a-f]{6}$/i.test(p.color))))throw Error('프로젝트 데이터의 형식이 올바르지 않아요.');
 for(const [key,list] of Object.entries(data.days)){
  if(!validDay(key)||!Array.isArray(list)||list.length!==48||!list.every(a=>a===null||activity(a)))throw Error('날짜 또는 활동 데이터의 형식이 올바르지 않아요.');
 }
}
function mergeBackup(data){
 checkBackup(data);
 const changes=new Map();let added=0,conflicts=0;
 if(data.version===3){const cur=projects(),have=new Set(cur.map(p=>p.id)),add=data.projects.filter(p=>!have.has(p.id)).map(p=>({id:p.id,name:p.name,color:p.color}));if(add.length)changes.set(uid+'.projects',JSON.stringify([...cur,...add]))}
 for(const [key,items] of Object.entries(data.version>=2?data.todos:{})){
  const merged=new Map(tasksOn(key).map(t=>[t.id,t]));
  for(const t of items)if(!merged.has(t.id)){const o={id:t.id,text:t.text,done:t.done};if(t.color)o.color=t.color;if(t.p)o.p=t.p;merged.set(t.id,o)}
  changes.set(uid+'.todo.'+key,JSON.stringify([...merged.values()]));
 }
 for(const [key,incoming] of Object.entries(data.days)){
  const current=read('.'+key)||Array(48).fill(null);
  const merged=current.map((old,i)=>{
   const next=incoming[i];
   if(!old&&next){added++;return next.p?{name:next.name,color:next.color,p:next.p}:{name:next.name,color:next.color}}
   if(old&&next&&!same(old,next))conflicts++;
   return old;
  });
  changes.set(uid+'.'+key,JSON.stringify(merged));
 }
 const undo=[];
 try{
  for(const [key,value] of changes){
   const old=records.getItem(key);
   if(old===value)continue;
   records.setItem(key,value);undo.push([key,old]);
  }
 }catch(error){
  for(const [key,old] of undo.reverse())if(old===null)records.removeItem(key);else records.setItem(key,old);
  throw Error('브라우저 저장 공간을 확인해 주세요.');
 }
 return {added,conflicts};
}
function popup(message){$('alertText').textContent=message;if(!$('alertBox').open)$('alertBox').showModal();$('alertOk').focus()}
$('alertOk').onclick=()=>$('alertBox').close();
function notifyUser(message){$('notice').textContent=message;$('notice').hidden=false}
let downloadsApi=null;
if(window.claude?.use)claude.use('downloads').then(api=>{downloadsApi=api}).catch(()=>{});
$('download').onclick=async()=>{
 let text;
 try{const data=backupData();checkBackup(data);text=JSON.stringify(data)}
 catch{notifyUser('기록을 다운로드할 수 없어요. 저장된 기록을 확인해 주세요.');return}
 const filename='48BLOCKS-'+dateKey(new Date())+'.json';
 if(window.claude?.use){
  if(!downloadsApi){notifyUser('이 화면에서는 파일을 내려받을 수 없어요.');return}
  try{await downloadsApi.save({filename,data:text})}
  catch(error){
   if(error?.code==='declined')return;
   notifyUser(error?.code==='rate_limited'?'잠시 후 다시 시도해 주세요.':'백업 파일을 내려받지 못했어요.');
  }
  return;
 }
 const url=URL.createObjectURL(new Blob([text],{type:'application/json'}));
 const a=document.createElement('a');a.href=url;a.download=filename;
 document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
};

 }catch(error){popup(error instanceof SyntaxError?'JSON 백업 파일을 읽을 수 없어요.':error.message)}
 finally{e.target.value=''}
};

function preventPinch(event){
 if(event.cancelable)event.preventDefault();
}

 document.addEventListener(type,preventPinch,{passive:false});
}

},{passive:false});
