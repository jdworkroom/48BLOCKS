 if(syncing||!cloud)return;

 while(cloud&&pendingSync.size){

   const changed=[];
   for(const d of snap.docs){

}

  const t=e.touches[0],dx=t.clientX-dateSwipe.x,dy=Math.abs(t.clientY-dateSwipe.y);
  if(t.identifier!==dateSwipe.id||(!slide&&dy>10&&dy>=Math.abs(dx))){dateSwipe=null;clearSlide();return}
  if(!slide&&(Math.abs(dx)<8||Math.abs(dx)<=dy*1.5))return;
  if(!e.cancelable){dateSwipe=null;clearSlide();return}
  e.preventDefault();
  resetDrag();
  previewDay(dx<0?1:-1);
  positionSlide(dx);
 },{passive:false});
 surface.addEventListener('touchend',e=>{
  const start=dateSwipe;
  dateSwipe=null;
  if(!start||!slide||slide.finishing)return;
  if(e.cancelable)e.preventDefault();
  const t=Array.from(e.changedTouches).find(t=>t.identifier===start.id);
  const travel=t?(start.x-t.clientX)*slide.direction:0;
  settleSlide(travel>=Math.min(90,Math.max(52,slide.width*.18)));
 },{passive:false});
 surface.addEventListener('touchcancel',()=>{dateSwipe=null;clearSlide()});
}

function hideSuggest(){$('suggest').hidden=true;$('suggest').replaceChildren();$('name').setAttribute('aria-expanded','false')}
const dayTodos=()=>tasksOn(day).filter(t=>!t.done).map(t=>({name:t.text.trim().slice(0,60),color:t.color||null,todo:true}));
function showSuggest(){
 const q=$('name').value.trim(),list=$('suggest');list.replaceChildren();
 const lower=q.toLowerCase(),todos=dayTodos();
 if(!q&&(!ed||ed.uniformEdit||!todos.length)){hideSuggest();return}
 const match=x=>!q||x.name.toLowerCase().includes(lower);
 const rank=(a,b)=>b.name.toLowerCase().startsWith(lower)-a.name.toLowerCase().startsWith(lower);
 const todoHits=todos.filter(match).sort(rank).slice(0,q?3:5),seen=new Set(todoHits.map(x=>x.name));
 const recentHits=q?recentItems().filter(x=>match(x)&&!seen.has(x.name)).sort(rank).slice(0,4):[];
 const all=[...todoHits,...recentHits].filter(x=>x.name!==q).slice(0,3),exact=true;
 for(const item of all){
  const li=node('li',''),b=node('button','');b.type='button';
  b.append(dot(item.color||'#d0d0cb'),node('span',item.name));if(item.todo)b.append(node('small','TO DO'));
  b.onpointerdown=e=>e.preventDefault();
  b.onclick=()=>{$('name').value=item.name;choose(item.color||autoColor(),!!item.color);hideSuggest();updateSheet()};
  li.append(b);list.append(li);
 }

  const li=node('li',''),b=node('button','');b.type='button';
  const plus=node('span','+');plus.className='plus';
  b.append(plus,node('span','‘'+q+'’ 새 활동으로'),node('small',colorTouched?'고른 색 사용':'안 쓴 색 자동 지정'));

  b.onclick=()=>{if(!colorTouched)choose(autoColor());hideSuggest();updateSheet()};

 if(item){const recent=recentItems();records.setItem(uid+'.recent',JSON.stringify([item,...recent.filter(x=>!same(x,item))].slice(0,30)))}

const touchDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);

 if(e.touches.length===2&&!$('table').hidden&&!document.querySelector('dialog[open]')){pinch={d:touchDist(e.touches),done:false};resetDrag();dateSwipe=null;clearSlide()}

function validDay(key){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(key))return false;
 const d=new Date(key+'T12:00');
 return !Number.isNaN(d.getTime())&&dateKey(d)===key;
}
function backupData(){
 const days={},todos={};
 for(let i=0;i<records.length;i++){
  const key=records.key(i);
  if(key.startsWith(uid+'.todo.')&&validDay(key.slice((uid+'.todo.').length)))todos[key.slice((uid+'.todo.').length)]=JSON.parse(records.getItem(key));
  if(key.startsWith(uid+'.')&&validDay(key.slice(uid.length+1))){
   const dayKey=key.slice(uid.length+1);
   days[dayKey]=read('.'+dayKey);
  }
 }
 return {format:'haru-blocks',version:2,days,todos,recent:read('.recent')||[]};
}
function checkBackup(data){
 const activity=a=>a&&typeof a.name==='string'&&a.name.trim()&&a.name.length<=60&&typeof a.color==='string'&&/^#[0-9a-f]{6}$/i.test(a.color);
 if(data?.format!=='haru-blocks'||![1,2].includes(data.version)||!data.days||typeof data.days!=='object'||Array.isArray(data.days)||!Array.isArray(data.recent)||!data.recent.every(activity))throw Error('48BLOCKS에서 다운로드한 백업 파일을 선택해 주세요.');
 if(data.version===2&&(!data.todos||typeof data.todos!=='object'||Array.isArray(data.todos)||!Object.entries(data.todos).every(([key,items])=>validDay(key)&&Array.isArray(items)&&items.every(x=>x&&typeof x.id==='string'&&x.id&&typeof x.text==='string'&&x.text.trim()&&x.text.length<=200&&typeof x.done==='boolean'&&(x.color===undefined||(typeof x.color==='string'&&/^#[0-9a-f]{6}$/i.test(x.color)))))))throw Error('할 일 데이터의 형식이 올바르지 않아요.');
 for(const [key,list] of Object.entries(data.days)){
  if(!validDay(key)||!Array.isArray(list)||list.length!==48||!list.every(a=>a===null||activity(a)))throw Error('날짜 또는 활동 데이터의 형식이 올바르지 않아요.');
 }
}
function mergeBackup(data){
 checkBackup(data);
 const changes=new Map();let added=0,conflicts=0;
 for(const [key,items] of Object.entries(data.version===2?data.todos:{})){
  const merged=new Map(tasksOn(key).map(t=>[t.id,t]));
  for(const t of items)if(!merged.has(t.id))merged.set(t.id,t.color?{id:t.id,text:t.text,done:t.done,color:t.color}:{id:t.id,text:t.text,done:t.done});
  changes.set(uid+'.todo.'+key,JSON.stringify([...merged.values()]));
 }
 for(const [key,incoming] of Object.entries(data.days)){
  const current=read('.'+key)||Array(48).fill(null);
  const merged=current.map((old,i)=>{
   const next=incoming[i];
   if(!old&&next){added++;return {name:next.name,color:next.color}}
   if(old&&next&&!same(old,next))conflicts++;
   return old;
  });
  changes.set(uid+'.'+key,JSON.stringify(merged));
 }
 const recent=new Map();
 for(const a of [...(read('.recent')||[]),...data.recent]){
  recent.set(JSON.stringify([a.name,a.color]),{name:a.name,color:a.color});
 }
 changes.set(uid+'.recent',JSON.stringify([...recent.values()]));
 const undo=[];
 try{
  for(const [key,value] of changes){
   const old=records.getItem(key);
   if(old===value)continue;
   records.setItem(key,value);undo.push([key,old]);
  }
 }catch(error){
  for(const [key,old] of undo.reverse())if(old===null)records.removeItem(key);else records.setItem(key,old);
  throw Error('브라우저 저장 공간을 확인해 주세요.');
 }
 return {added,conflicts};
}

function preventPinch(event){

}

}
